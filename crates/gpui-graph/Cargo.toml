[package]
name = "gpui-graph"
version = "0.1.6"
description = "Force-directed network graph component for GPUI, built on gpui-base."
keywords = ["gpui", "graph", "network", "force-directed", "visualization"]
categories = ["gui", "visualization"]
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/gpui-graph"
readme = "README.md"
edition.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
gpui-base.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-base = { workspace = true, features = ["test-support"] }
