[package]
name = "gpui-graph"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-base = "=0.7.3"
# Must match the GPUI snapshot that gpui-base 0.7.3 was built against.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }

[profile.dev.package."*"]
opt-level = 2
