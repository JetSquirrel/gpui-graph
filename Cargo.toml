[workspace]
members = ["crates/gpui-graph", "examples/basic", "examples/query-app"]
default-members = ["examples/query-app"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
gpui-graph = { path = "crates/gpui-graph" }
gpui-base = "=0.8.0"
# Must match the GPUI snapshot that gpui-base 0.8.0 was built against.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }

[profile.dev.package."*"]
opt-level = 2
