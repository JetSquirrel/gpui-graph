name: Release

# Publish by pushing a tag that matches the crate version:
#   git tag gpui-graph-v0.2.0 && git push origin gpui-graph-v0.2.0
on:
  push:
    tags:
      - "gpui-graph-v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  publish:
    name: Publish to crates.io
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Tag matches crate version
        run: |
          tag="${GITHUB_REF_NAME#gpui-graph-v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gpui-graph") | .version')
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gpui-graph version $version"
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings
      - name: Test
        run: cargo test --workspace --locked

      - name: Publish
        run: cargo publish -p gpui-graph --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATE_TOKEN }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
